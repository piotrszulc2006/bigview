[package]
name = "bigview"
version = "0.1.0"
edition = "2021"
description = "Open multi-gigabyte text files instantly"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
bigview-core = { path = "../../core" }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
